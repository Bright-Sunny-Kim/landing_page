<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="glowGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow512" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Outer Card -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad512)"/>
  <rect width="512" height="512" rx="112" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="6"/>
  
  <!-- Glow Effect -->
  <circle cx="256" cy="256" r="160" fill="url(#glowGrad512)" filter="url(#glow512)" opacity="0.4"/>
  <circle cx="256" cy="256" r="148" fill="url(#glowGrad512)"/>
  
  <!-- Dark Glass Center -->
  <circle cx="256" cy="256" r="128" fill="#09090b" opacity="0.3"/>
  
  <!-- Main Symbol 'H' (HyeAn) -->
  <text x="256" y="278" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="150" font-weight="900" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">H</text>
  
  <!-- Sparkle / Insight Symbol ✨ -->
  <path d="M 358 132 Q 369 154 391 165 Q 369 176 358 198 Q 347 176 325 165 Q 347 154 358 132 Z" fill="#fbbf24"/>
  <path d="M 154 340 Q 160 352 172 358 Q 160 364 154 376 Q 148 364 136 358 Q 148 352 154 340 Z" fill="#60a5fa" opacity="0.8"/>
</svg>
