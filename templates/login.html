<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="회계법인 혜안 고객 포털입니다. 로그인하여 고객 전용 대시보드로 이동하세요.">
    <title>회계법인 혜안 - 로그인</title>
    <!-- Google Fonts: Outfit & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Style CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="background-decor">
        <div class="circle circle-1"></div>
        <div class="circle circle-2"></div>
    </div>
    
    <main class="login-container">
        <div class="glass-card">
            <header class="card-header">
                <div class="logo">
                    <span class="logo-icon">✦</span>
                    <span class="logo-text">Hyean</span>
                </div>
                <h1 id="main-heading">환영합니다! 회계법인혜안입니다.</h1>
                <p class="subtitle">로그인하여 고객님의 페이지로 이동하세요</p>
            </header>
            
            <form action="{{ url_for('login') }}" method="POST" class="login-form" id="login-form">
                <div class="input-group">
                    <input type="email" id="email" name="email" required autocomplete="off" placeholder=" ">
                    <label for="email">이메일 주소</label>
                    <span class="bar"></span>
                </div>
                
                <div class="input-group">
                    <input type="text" id="company" name="company" required autocomplete="off" placeholder=" ">
                    <label for="company">회사명</label>
                    <span class="bar"></span>
                </div>
                
                <div class="input-group">
                    <input type="text" id="username" name="username" required autocomplete="off" placeholder=" ">
                    <label for="username">담당자 이름</label>
                    <span class="bar"></span>
                </div>
                
                <div class="input-group select-group">
                    <select id="task_type" name="task_type" required>
                        <option value="" disabled selected hidden></option>
                        <option value="회계감사">회계감사</option>
                        <option value="세무 자문">세무 자문</option>
                        <option value="장부기장">장부기장</option>
                        <option value="경영컨설팅">경영컨설팅</option>
                        <option value="기타">기타</option>
                    </select>
                    <label for="task_type">해당 업무</label>
                    <span class="bar"></span>
                </div>
                
                <button type="submit" id="btn-submit" class="btn-submit">
                    <span>로그인 및 대시보드 입장</span>
                    <svg class="btn-arrow" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M5 12H19M19 12L13 6M19 12L13 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </form>
        </div>
    </main>
    
    <!-- Script JS -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
