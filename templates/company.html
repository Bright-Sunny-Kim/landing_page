<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{{ company_name }} 기업 회원을 위한 개인화 웰컴 포털 페이지입니다.">
    <title>{{ company_name }} - Welcome Portal</title>
    <!-- Google Fonts: Outfit & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Style CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="background-decor">
        <div class="circle circle-1"></div>
        <div class="circle circle-2"></div>
    </div>
    
    <main class="dashboard-container">
        <div class="glass-card dashboard-card">
            <header class="dashboard-header">
                <div class="status-badge">
                    <span class="pulse-dot"></span>
                    <span>인증된 기업 파트너</span>
                </div>
                <h1 id="dashboard-heading"><span class="company-highlight">{{ company_name }}</span> 전용 공간</h1>
            </header>
            
            {% if success %}
            <div class="alert-success-box">
                <span class="alert-icon">✓</span>
                <span class="alert-text">문의사항과 첨부파일이 성공적으로 접수되었습니다.</span>
            </div>
            {% endif %}
            
            <!-- 업무 요청 폼 -->
            <form action="{{ url_for('submit_request') }}" method="POST" enctype="multipart/form-data" class="request-form">
                <div class="form-group-block">
                    <label for="help_text" class="field-label">무엇을 도와 드릴까요?</label>
                    <textarea id="help_text" name="help_text" required rows="5" placeholder="혜안 회계법인에 요청하실 세무 자문, 기장 대리, 감사 등의 상세 내용을 작성해 주세요."></textarea>
                </div>
                
                <div class="form-group-block">
                    <label class="field-label">파일을 올려주세요</label>
                    <div class="file-upload-wrapper">
                        <input type="file" id="file" name="file" class="file-input-hidden">
                        <label for="file" class="file-drop-area">
                            <span class="upload-cloud-icon">↑</span>
                            <span class="file-select-btn">파일 선택하기</span>
                            <span class="file-name-preview" id="file-name-preview">선택된 파일 없음</span>
                        </label>
                    </div>
                </div>
                
                <button type="submit" id="btn-request-submit" class="btn-submit">
                    <span>업무 요청 제출하기</span>
                    <svg class="btn-arrow" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M5 12H19M19 12L13 6M19 12L13 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </form>
            
            <footer class="dashboard-footer">
                <a href="{{ url_for('logout') }}" id="btn-logout" class="btn-logout">
                    <span>안전하게 로그아웃</span>
                    <svg class="btn-exit-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M17 16L21 12M21 12L17 8M21 12H9M9 21H5C3.89543 21 3 20.1046 3 19V5C3 3.89543 3.89543 3 5 3H9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </a>
            </footer>
        </div>
    </main>
    
    <!-- Script JS -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
